<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orbit</title>
    <script>
      // Set the theme class before React mounts so the panel never flashes
      // light. The app's dark variant is class-based, so a bare
      // prefers-color-scheme media query would leave every dark: utility dead.
      try {
        var dark = window.matchMedia("(prefers-color-scheme: dark)");
        document.documentElement.classList.toggle("dark", dark.matches);
        dark.addEventListener("change", function (e) {
          document.documentElement.classList.toggle("dark", e.matches);
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
