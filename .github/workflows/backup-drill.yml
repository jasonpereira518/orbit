name: Disaster Recovery & Backup Drill

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: backup-drill
  cancel-in-progress: false

jobs:
  backup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Schema & Restore Verification Drill
        run: npx tsx scripts/ops/restore-drill.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report Disaster Recovery Health
        if: success()
        run: echo "Orbit Disaster Recovery Drill passed successfully."
