# The PR gate: typecheck, lint, a production build, the smoke suite, and the Playwright
# browser flows. The Chrome extension has its own workflow (extension.yml) that runs only
# when a PR touches it.
#
# Nothing here needs a secret. The build runs without Clerk or database keys (the app
# fails closed at runtime, not at build), `check:env` only gates VERCEL builds via
# vercel.json, and the smoke suite runs against a throwaway PGlite directory — there is no
# `.env.local` in CI, and scripts/smoke/_env.ts deletes DATABASE_URL regardless.
#
# Turn this into a real gate in GitHub → Settings → Branches → main: require the `check`
# and `smoke` status checks before merging.
name: ci

# CI runs where a result can change a decision, and nowhere else:
#
# - Pull requests, plus every push to `main`. The `main` run is not a repeat of the PR's:
#   parallel PRs each pass against their own base, and only `main` sees them together.
#   It is also the only run whose caches (node_modules, .next/cache) every PR can restore;
#   GitHub scopes a PR's caches to that PR, so without it each PR's first run starts cold.
# - Draft PRs are skipped. A PR runs CI when it is opened ready, or when a draft is marked
#   ready for review, and on every push after that. A ready PR gets every job.
# - `paths-ignore` skips the run for changes no job reads: docs, agent skills, the
#   extension (extension.yml covers it), and the workflows that do not touch the app.
#   docs/RUNBOOK.md is re-included because scripts/smoke-schedules.ts parses it. There are
#   no required status checks on main (Protected Main Branch only blocks deletion and
#   force-pushes); if `check`/`smoke` are ever made required, drop `paths-ignore`, or a
#   docs-only PR waits forever on checks that never start.
#
# The repository is public, so hosted runners are free. This workflow is written to stay
# safe there: it triggers on `pull_request` (never `pull_request_target` or `workflow_run`),
# so a fork's PR runs with a read-only token and no secrets, and it uses none. Keep it that
# way; the two workflows that do use secrets (ops, backup) run only on schedule or manual
# dispatch from the default branch.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore: &ignore
      - "**.md"
      - "docs/**"
      - "!docs/RUNBOOK.md"
      - ".agents/**"
      - ".claude/**"
      - "extension/**"
      - ".github/workflows/ops.yml"
      - ".github/workflows/backup.yml"
      - ".github/workflows/extension.yml"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore: *ignore
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on `main`: production deploys every push to it, and a quick follow-up
  # push used to cancel the earlier commit's run, so that commit shipped with no verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every job restores node_modules from a cache keyed on the lockfile and Node version and
# runs `npm ci` only on a miss: the install was ~30s of every job, repeated on every push.
# The root package has no install scripts, so a restored node_modules is exactly what
# `npm ci` would have produced.
jobs:
  check:
    name: typecheck · lint · build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Independent and both CPU-bound on a 4-core runner, so they run side by side; `wait`
      # on each pid so either one failing fails the step.
      - name: typecheck + lint
        run: |
          npm run typecheck & tsc=$!
          npm run lint & lint=$!
          wait $tsc && wait $lint
      - name: Cache the Next.js compiler output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          # Keep the Sentry build plugin quiet and source-map upload off in CI.
          SENTRY_AUTH_TOKEN: ""

  # The smoke suite is ~400 scripts run one after another (PGlite is single-writer), about
  # ten minutes serially and by far the slowest job. Three machines run exactly the same
  # scripts (scripts/run-smoke.ts --shard i/n covers each one once), each with its own
  # PGlite directory, so the single-writer rule holds. Three rather than four: with the
  # install cached, three shards finish alongside the build, and a fourth only added a check.
  # `fail-fast: false` so one shard failing still reports the rest.
  #
  # The job id stays `smoke`, and the matrix names read `smoke suite (PGlite) 1/3` …; if a
  # required status check is ever added, require all three names.
  smoke:
    name: smoke suite (PGlite) ${{ matrix.shard }}/3
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm test -- --shard ${{ matrix.shard }}/3

  e2e:
    name: browser flows (Playwright)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SENTRY_AUTH_TOKEN: ""
      - name: Keep the report when a flow breaks
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Everything above runs on PGlite (no pgvector, one backend, no lock contention), which is
  # how a migration that rewrote `contacts` on every deploy, and a claim query that handed one
  # row to several runs, reached production unnoticed. This job runs the real application code
  # against real Postgres + pgvector, through reliability/lib/neon-shim.mjs (a local stand-in
  # for Neon's HTTP endpoint), and fails on a regression:
  #   - a schema sweep under live traffic, with and without the runbook's statement_timeout,
  #     must not drop search_tsv or the trigram index, and traffic must see no errors;
  #   - concurrent sync claims must never hand one row out twice;
  #   - the Postgres-backed rate limiter must admit exactly its limit under a burst.
  # See reliability/README.md. No secrets; the database is a throwaway service container.
  db-real:
    name: real Postgres (migrations, claims, limiter)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit-local-only
          POSTGRES_DB: orbit_rel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: orbit-local-only
      NEON_SHIM_URL: http://127.0.0.1:4444/sql
      DATABASE_URL: postgresql://orbit:x@shim.local/orbit_rel
      SHIM_PGPASSWORD: orbit-local-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm install --no-audit --no-fund --prefix reliability
      - name: Start the Neon HTTP stand-in
        run: |
          mkdir -p reliability/results
          (cd reliability && nohup node lib/neon-shim.mjs > results/shim.log 2>&1 &)
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4444/__stats >/dev/null 2>&1 && break; sleep 1; done
      - name: Migrate an empty database (the production migration script, unmodified)
        run: npx tsx reliability/lib/with-shim.mts scripts/migrate.ts
      - name: Seed a modest dataset
        run: |
          psql -h 127.0.0.1 -U orbit -d orbit_rel -q -v users=40 -v contacts_per=1500 -v vectors=500 \
            -v usage_events=20000 -v error_events=5000 -v reminders=5000 -f reliability/seed-bulk.sql
      - name: A schema sweep under live traffic, no statement_timeout
        run: reliability/tests/migration-under-load.sh orbit_rel
      - name: A schema sweep under live traffic, statement_timeout = 20s
        run: reliability/tests/migration-under-load.sh orbit_rel 20s
      - name: Concurrent sync claims never double-claim
        run: npx tsx reliability/lib/with-shim.mts reliability/tests/claim-race.mts
      - name: The rate limiter admits exactly its limit under a burst
        run: npx tsx reliability/lib/with-shim.mts reliability/tests/rate-limit-burst.mts
      - name: Keep the results when something breaks
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-real-results
          path: reliability/results/
          retention-days: 7
