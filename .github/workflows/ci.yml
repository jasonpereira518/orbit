# The gate `main` never had: typecheck, lint, a production build, the smoke suite, and the
# Playwright browser flows.
#
# Nothing here needs a secret. The build runs without Clerk or database keys (the app
# fails closed at runtime, not at build), `check:env` only gates VERCEL builds via
# vercel.json, and the smoke suite runs against a throwaway PGlite directory — there is no
# `.env.local` in CI, and scripts/smoke/_env.ts deletes DATABASE_URL regardless.
#
# Turn this into a real gate in GitHub → Settings → Branches → main: require the `check`
# and `smoke` status checks before merging.
name: ci

# Actions bills every job in whole minutes, so CI skips runs that cannot tell you anything:
#
# - Draft PRs are skipped. A PR runs CI when it is opened ready, or when a draft is marked
#   ready for review, and on every push after that. A ready PR gets every job.
# - `paths-ignore` skips the run for changes no job reads: docs, agent skills, and the two
#   workflows that only schedule ops calls. docs/RUNBOOK.md is re-included because
#   scripts/smoke-schedules.ts parses it. There are no required status checks on main
#   (Protected Main Branch only blocks deletion and force-pushes); if `check`/`smoke` are
#   ever made required, drop `paths-ignore` from `pull_request`, or a docs-only PR waits
#   forever on checks that never start.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore: &ignore
      - "**.md"
      - "docs/**"
      - "!docs/RUNBOOK.md"
      - ".agents/**"
      - ".claude/**"
      - ".github/workflows/ops.yml"
      - ".github/workflows/backup.yml"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore: *ignore

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Cache the Next.js compiler output
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          # Keep the Sentry build plugin quiet and source-map upload off in CI.
          SENTRY_AUTH_TOKEN: ""

  smoke:
    name: smoke suite (PGlite)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  extension:
    name: extension typecheck · build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci --no-audit --no-fund
      - run: npm --prefix extension run typecheck
      - run: npm --prefix extension run build

  e2e:
    name: browser flows (Playwright)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SENTRY_AUTH_TOKEN: ""
      - name: Keep the report when a flow breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
