# The PR gate: typecheck, lint, a production build, the smoke suite (with coverage), the
# known-bug suite, the Playwright browser flows, and a security pass (dependency audit,
# dependency review, secret scan). The Chrome extension has its own workflow
# (extension.yml) that runs only when a PR touches it. docs/TESTING.md describes the
# layers and the branch-protection settings that make these a real gate.
#
# Nothing here needs a secret. The build runs without Clerk or database keys (the app
# fails closed at runtime, not at build), `check:env` only gates VERCEL builds via
# vercel.json, and the smoke suite runs against a throwaway PGlite directory — there is no
# `.env.local` in CI, and scripts/smoke/_env.ts deletes DATABASE_URL regardless.
#
# Turn this into a real gate in GitHub → Settings → Branches → main: require the `check`
# and `smoke` status checks before merging.
name: ci

# CI runs where a result can change a decision, and nowhere else:
#
# - Pull requests, plus every push to `main`. The `main` run is not a repeat of the PR's:
#   parallel PRs each pass against their own base, and only `main` sees them together.
#   It is also the only run whose caches (node_modules, .next/cache) every PR can restore;
#   GitHub scopes a PR's caches to that PR, so without it each PR's first run starts cold.
# - Draft PRs are skipped. A PR runs CI when it is opened ready, or when a draft is marked
#   ready for review, and on every push after that. A ready PR gets every job.
# - `paths-ignore` skips the run for changes no job reads: docs, agent skills, the
#   extension (extension.yml covers it), and the workflows that do not touch the app.
#   docs/RUNBOOK.md is re-included because scripts/smoke-schedules.ts parses it. There are
#   no required status checks on main (Protected Main Branch only blocks deletion and
#   force-pushes); if `check`/`smoke` are ever made required, drop `paths-ignore`, or a
#   docs-only PR waits forever on checks that never start.
#
# The repository is public, so hosted runners are free. This workflow is written to stay
# safe there: it triggers on `pull_request` (never `pull_request_target` or `workflow_run`),
# so a fork's PR runs with a read-only token and no secrets, and it uses none. Keep it that
# way; the two workflows that do use secrets (ops, backup) run only on schedule or manual
# dispatch from the default branch.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore: &ignore
      - "**.md"
      - "docs/**"
      - "!docs/RUNBOOK.md"
      - ".agents/**"
      - ".claude/**"
      - "extension/**"
      - ".github/workflows/ops.yml"
      - ".github/workflows/backup.yml"
      - ".github/workflows/extension.yml"
      - ".github/workflows/post-deploy.yml"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore: *ignore
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job restores node_modules from a cache keyed on the lockfile and Node version and
# runs `npm ci` only on a miss: the install was ~30s of every job, repeated on every push.
# The root package has no install scripts, so a restored node_modules is exactly what
# `npm ci` would have produced.
jobs:
  check:
    name: typecheck · lint · build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Independent and both CPU-bound on a 4-core runner, so they run side by side; `wait`
      # on each pid so either one failing fails the step.
      - name: typecheck + lint
        run: |
          npm run typecheck & tsc=$!
          npm run lint & lint=$!
          wait $tsc && wait $lint
      - name: Cache the Next.js compiler output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          # Keep the Sentry build plugin quiet and source-map upload off in CI.
          SENTRY_AUTH_TOKEN: ""

  # The smoke suite is ~400 scripts run one after another (PGlite is single-writer), about
  # ten minutes serially and by far the slowest job. Three machines run exactly the same
  # scripts (scripts/run-smoke.ts --shard i/n covers each one once), each with its own
  # PGlite directory, so the single-writer rule holds. Three rather than four: with the
  # install cached, three shards finish alongside the build, and a fourth only added a check.
  # `fail-fast: false` so one shard failing still reports the rest.
  #
  # The job id stays `smoke`, and the matrix names read `smoke suite (PGlite) 1/3` …; if a
  # required status check is ever added, require all three names.
  smoke:
    name: smoke suite (PGlite) ${{ matrix.shard }}/3
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Under c8, which records V8 coverage for every script the runner spawns. Each shard
      # keeps only its Istanbul JSON (a few MB; the raw V8 dumps are gigabytes) for the
      # `coverage` job to merge. A failing script still fails this step exactly as before.
      - run: npx c8 --report-dir coverage/shard-${{ matrix.shard }} tsx scripts/run-smoke.ts --ci --shard ${{ matrix.shard }}/3
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}/coverage-final.json
          retention-days: 7
          if-no-files-found: ignore

  # Merges the shards' coverage and writes a per-area table to the run summary. Reports, does
  # not gate: there is no threshold yet (see docs/TESTING.md → Coverage for the ratchet).
  coverage:
    name: coverage report
    needs: smoke
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: coverage/shards
      - run: npm run coverage:merge -- coverage/shards
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-merged
          path: coverage/merged/
          retention-days: 14

  # Documented-but-unfixed bugs (scripts/smoke-bug-*.ts). Each asserts the correct behaviour,
  # so it fails while its bug is there; `--bugs` inverts the verdict. This job goes red in
  # exactly two cases, both worth a look: a bug got FIXED (promote the script to an ordinary
  # tier), or a bug script broke in some other way.
  known-bugs:
    name: known bugs (expected failures)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run test:bugs

  # Supply chain and secrets. Three independent checks, each answering a different question:
  #
  # - `npm audit` (production dependencies): is anything we ship CRITICALLY vulnerable right
  #   now? Gated at critical only, because at the time of writing there are 15 high and 11
  #   moderate advisories, all transitive and all fixable with `npm audit fix`; gating at
  #   high would turn every PR red until that is done. Tighten to `--audit-level=high` once
  #   it is (docs/TESTING.md tracks it).
  # - Dependency review (PRs only): does THIS PR add a dependency with a high advisory? That
  #   gates new risk without inheriting the backlog above.
  # - gitleaks: does any commit in this push or PR add a secret? Scans only the new commits
  #   (the history has pre-existing hits to triage, listed in docs/TESTING.md), so the gate
  #   is "no new secrets", and a finding names the commit and file without printing the value.
  security:
    name: audit · dependency review · secret scan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies)
        run: |
          npm audit --omit=dev --audit-level=high || true   # the full picture, in the log
          npm audit --omit=dev --audit-level=critical
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Secret scan (new commits only)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch's push has no `before`; fall back to the last commit alone.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD~1..$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          echo "scanning $range"
          /tmp/gitleaks git --no-banner --redact --log-opts="$range" .

  e2e:
    name: browser flows (Playwright)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SENTRY_AUTH_TOKEN: ""
      - name: Keep the report when a flow breaks
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
