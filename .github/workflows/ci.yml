# The gate `main` never had: typecheck, lint, a production build, the smoke suite, and the
# Playwright browser flows.
#
# Nothing here needs a secret. The build runs without Clerk or database keys (the app
# fails closed at runtime, not at build), `check:env` only gates VERCEL builds via
# vercel.json, and the smoke suite runs against a throwaway PGlite directory — there is no
# `.env.local` in CI, and scripts/smoke/_env.ts deletes DATABASE_URL regardless.
#
# Turn this into a real gate in GitHub → Settings → Branches → main: require the `check`
# and `smoke` status checks before merging.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Cache the Next.js compiler output
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          # Keep the Sentry build plugin quiet and source-map upload off in CI.
          SENTRY_AUTH_TOKEN: ""

  smoke:
    name: smoke suite (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  extension:
    name: extension typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci --no-audit --no-fund
      - run: npm --prefix extension run typecheck
      - run: npm --prefix extension run lint
      - run: npm --prefix extension run test
      - run: npm --prefix extension run build

  # The permission model against real Chrome: one click on the toolbar action
  # must open the panel AND read the page (extension/docs/permission-spike.md).
  # Headed Chrome under xvfb, because Extensions.triggerAction refuses headless.
  # Non-blocking until it has proven stable on the runners.
  extension-e2e:
    name: extension e2e (permissions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci --no-audit --no-fund
      - run: npm --prefix extension run build:e2e
      - run: xvfb-run --auto-servernum node extension/e2e/permissions.e2e.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome

  e2e:
    name: browser flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SENTRY_AUTH_TOKEN: ""
      - name: Keep the report when a flow breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
