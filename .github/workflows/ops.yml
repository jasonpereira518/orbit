# The scheduler Orbit's Hobby plan does not have.
#
# Vercel Hobby runs crons at most once a day, so this workflow drives the four things that
# need to happen more often: the known-condition ops sweep (every ten minutes), the
# process-stalled job (hourly, so a lost import continuation stalls for an hour, not a day),
# the connector sync (every 15 minutes), and the follow-up engine's daily pass (hourly, so
# every user's local 07:00 falls inside some invocation). It also tells the sweep where
# `main` is, so production pinned to an old deploy by a failed build shows up as
# `deploy.drift`.
#
# Caveats, both absorbed by the Better Stack heartbeat the sweep pings on success: GitHub
# schedules routinely lag 5–30 minutes under load, and on a public repository they are
# disabled after 60 days without a commit. If the heartbeat goes quiet, look here first.
#
# The same caveats make `next_sync_at` a floor rather than a promise for the connector sync
# below: nothing may assume a fixed interval between runs.
#
# Every schedule added here raises the effective cadence of any step whose `if:` is not
# gated to exclude it — the sweep and webhook-drain steps below both list every OTHER
# schedule string on purpose. Widen both `if:` conditions in the same edit that adds a new
# schedule, or the sweep silently speeds up. This has happened before (commit e9bc98e).
#
# Secrets: APP_URL (https://orbit.jasonpereira.live), CRON_SECRET (the same value as the
# Vercel env var), SLACK_OPS_CRITICAL_WEBHOOK_URL (for the "app is down" fallback).
name: ops

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 * * * *"
    - cron: "*/15 * * * *"
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Health probe
        id: health
        continue-on-error: true
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$APP_URL/api/health" || echo "000")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "health: HTTP $code"; cat /tmp/health.json 2>/dev/null; echo
          test "$code" = "200"
        env:
          APP_URL: ${{ secrets.APP_URL }}

      - name: Page on a down probe
        if: steps.health.outcome == 'failure'
        run: |
          if [ -z "$SLACK_OPS_CRITICAL_WEBHOOK_URL" ]; then
            echo "SLACK_OPS_CRITICAL_WEBHOOK_URL not set, skipping"
            exit 0
          fi
          curl -sS --max-time 10 -X POST -H 'content-type: application/json' \
            --data "{\"text\":\":rotating_light: *[critical] /api/health answered HTTP ${{ steps.health.outputs.code }}* from the scheduler. If the uptime monitor agrees, production is down.\"}" \
            "$SLACK_OPS_CRITICAL_WEBHOOK_URL"
        env:
          SLACK_OPS_CRITICAL_WEBHOOK_URL: ${{ secrets.SLACK_OPS_CRITICAL_WEBHOOK_URL }}

      # Excluded from the sync-only and follow-up-only schedules on purpose. Without these
      # gates, adding another cron would silently raise the sweep's own cadence from every
      # ten minutes to roughly every six — more alert evaluations and more ledger rows than
      # anyone chose. An empty `github.event.schedule` (workflow_dispatch) still passes, so
      # a manual run sweeps.
      - name: Run the ops sweep
        if: github.event.schedule != '*/15 * * * *' && github.event.schedule != '23 * * * *' && steps.health.outcome == 'success'
        run: |
          main_sha=$(git rev-parse HEAD)
          main_at=$(git log -1 --format=%cI)
          curl -sS --fail-with-body --max-time 55 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            --data "{\"mainSha\":\"$main_sha\",\"mainCommittedAt\":\"$main_at\"}" \
            "$APP_URL/api/ops/sweep"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Run the stalled-import backstop (hourly)
        if: github.event.schedule == '7 * * * *' && steps.health.outcome == 'success'
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/imports/process-stalled"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Outbound webhook retries. Rides the existing ten-minute schedule rather than adding a
      # fourth: a delivery that failed can wait ten minutes, and the drain has its own route so
      # its latency never delays the sweep above.
      - name: Drain outbound webhooks
        if: github.event.schedule != '*/15 * * * *' && github.event.schedule != '23 * * * *' && steps.health.outcome == 'success'
        run: |
          curl -sS --fail-with-body --max-time 55 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/webhooks/outbound/drain"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Continuous connector sync (Google Calendar today). Its own schedule rather than a
      # rider on the ten-minute sweep: that sweep is the alerting path and is already budgeted
      # to 55s, and a provider call of unpredictable latency must not make the alert cadence
      # hostage to Google being slow.
      #
      # Gated on the schedule only. A `secrets.*` reference in an `if:` is not permitted and
      # fails the whole workflow at parse time — see commit e9bc98e.
      - name: Run the connector sync (every 15 minutes)
        if: github.event.schedule == '*/15 * * * *' && steps.health.outcome == 'success'
        run: |
          curl -sS --fail-with-body --max-time 300 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/sync/run"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # The follow-up engine's daily pass. Hourly rather than daily because users are in
      # many timezones and each one's local 07:00 has to fall inside some invocation; the
      # scheduler itself only claims users whose `follow_up_next_pass_at` has arrived, so
      # 23 of every 24 runs are a cheap no-op query.
      - name: Run the follow-up pass (hourly)
        if: github.event.schedule == '23 * * * *' && steps.health.outcome == 'success'
        run: |
          curl -sS --fail-with-body --max-time 300 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/follow-ups/run"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
